name: ACR cleanup

# 临时任务：删除历史遗留的 :latest tag（只删 latest，不动版本号 tag）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete latest tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: skopeo delete
      env:
        ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
        ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      run: |
        set -uo pipefail

        authfile="$RUNNER_TEMP/acr-auth.json"
        umask 077
        printf '{"auths":{"%s":{"auth":"%s"}}}' \
            "$ALIYUN_REGISTRY" \
            "$(printf '%s:%s' "$ALIYUN_REGISTRY_USER" "$ALIYUN_REGISTRY_PASSWORD" | base64 -w0)" \
            > "$authfile"

        echo "仓库地址: $ALIYUN_REGISTRY"
        echo

        for repo in \
            huayangtongxin/alpine \
            huayangtongxin/nginx \
            huayangtongxin/redis \
            huayangtongxin/livekit-server
        do
            ref="docker://$ALIYUN_REGISTRY/$repo:latest"
            if ! skopeo inspect --authfile "$authfile" --raw "$ref" > "$RUNNER_TEMP/m.json" 2>/dev/null; then
                echo "$repo  没有 latest，跳过"
                continue
            fi
            dg="sha256:$(sha256sum "$RUNNER_TEMP/m.json" | cut -d' ' -f1)"
            echo "$repo:latest -> $dg"
            if skopeo delete --authfile "$authfile" "docker://$ALIYUN_REGISTRY/$repo@$dg"; then
                echo "  已删除"
            else
                echo "  删除失败（ACR 可能不允许 API 删除，需要控制台操作）"
            fi
            echo
        done

        echo "===== 删除后剩余 tag ====="
        for repo in \
            huayangtongxin/alpine \
            huayangtongxin/nginx \
            huayangtongxin/redis \
            huayangtongxin/livekit-server
        do
            tags="$(skopeo list-tags --authfile "$authfile" "docker://$ALIYUN_REGISTRY/$repo" 2>&1 | tr -d '\n' | sed 's/  */ /g')"
            printf '%-34s %s\n' "$repo" "$tags"
        done
