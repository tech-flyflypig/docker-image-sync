name: Docker Image Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # 只有改了镜像清单、workflow 或解析脚本才触发，改读文档不会触发搬运
    paths:
      - 'images.txt'
      - '.github/workflows/docker.yaml'
      - '.github/scripts/plan.sh'

# 同一个仓库同时只跑一个搬运任务，避免并发抢配额、互相覆盖 tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 本任务只需要读代码，不给多余权限
permissions:
  contents: read

jobs:

  # ===== 第一步：解析 images.txt，生成并行矩阵 =====
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: 解析 images.txt
      id: plan
      run: bash .github/scripts/plan.sh

  # ===== 第二步：每个镜像一个 job 并行搬运 =====
  sync:
    name: ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 一个镜像失败不影响其它镜像
      fail-fast: false
      # 同时最多搬几个；阿里云侧限速或 runner 配额紧张就调小
      max-parallel: 5
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 用 skopeo 直接在两个 registry 之间搬 blob：
    # - 不落本地镜像，40GB 的镜像也不用先扩容磁盘
    # - --all 保留多架构 manifest list，不再是「单架构另存一份」
    - name: Sync image (skopeo)
      env:
        ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
        ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        IMAGE: ${{ matrix.image }}
        PLATFORM: ${{ matrix.platform }}
        # 目标仓库路径（命名空间/镜像名:tag），不含仓库地址
        TARGET: ${{ matrix.target }}
      run: |
        set -uo pipefail

        # 先确认 Secrets 都配了，比 skopeo 报错更好定位
        for v in ALIYUN_REGISTRY ALIYUN_REGISTRY_USER ALIYUN_REGISTRY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
                echo "::error::缺少 Secret: $v"
                exit 1
            fi
        done

        if ! command -v skopeo >/dev/null 2>&1; then
            echo "runner 上没有 skopeo，安装一下"
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
        fi

        # 凭据放临时 authfile，避免密码出现在命令行/进程列表
        authfile="$RUNNER_TEMP/acr-auth.json"
        umask 077
        printf '{"auths":{"%s":{"auth":"%s"}}}' \
            "$ALIYUN_REGISTRY" \
            "$(printf '%s:%s' "$ALIYUN_REGISTRY_USER" "$ALIYUN_REGISTRY_PASSWORD" | base64 -w0)" \
            > "$authfile"

        src="docker://$IMAGE"
        dst_ref="$ALIYUN_REGISTRY/$TARGET"
        dst="docker://$dst_ref"

        # 取「顶层 manifest / manifest list」的 digest：
        # 注意不能用 skopeo inspect --format '{{.Digest}}'，那个会解析到当前平台的子 manifest，
        # 多架构镜像下比到的不是 index；这里直接对 --raw 输出算 sha256。
        raw_digest() {
            local url="$1"; shift
            local f
            f="$(mktemp "$RUNNER_TEMP/manifest.XXXXXX")"
            if skopeo inspect --retry-times 3 --raw "$@" "$url" > "$f" 2>/dev/null; then
                sha256sum "$f" | cut -d' ' -f1
                rm -f "$f"
                return 0
            fi
            rm -f "$f"
            return 1
        }

        # 写 job summary：$1=标题 $2=模式 $3=附加说明
        summary() {
            {
                echo "### $1"
                echo ""
                echo "- 目标: \`$dst_ref\`"
                if [ -n "${2:-}" ]; then echo "- 模式: $2"; fi
                if [ -n "${3:-}" ]; then echo "- $3"; fi
                if [ -n "$src_digest" ]; then echo "- 源 digest: \`$src_digest\`"; fi
            } >> "$GITHUB_STEP_SUMMARY"
        }

        # 列出 index 里各架构的子 manifest digest（排序后用空格连成一串，便于比较）
        pdigests() {
            python3 "$GITHUB_WORKSPACE/.github/scripts/index_platforms.py" "$1" \
                | awk -F'|' '$1=="PF"{print $5}' | sort | tr '\n' ' '
        }

        # ---- 已存在且 index digest 一致就跳过，省掉整次全量拉取 ----
        src_digest="$(raw_digest "$src" || true)"
        dst_digest="$(raw_digest "$dst" --authfile "$authfile" || true)"

        echo "源 digest: ${src_digest:-<获取失败>}"
        echo "目标 digest: ${dst_digest:-<不存在或获取失败>}"

        if [ -n "$src_digest" ] && [ "$src_digest" = "$dst_digest" ]; then
            echo "目标已是最新，跳过: $dst"
            summary "⏭️ $IMAGE" "" "已存在且 digest 一致，跳过"
            exit 0
        fi

        # ---- 复制 ----
        copy_args=(--authfile "$authfile" --retry-times 3)

        if [ -n "${PLATFORM:-}" ]; then
            # 指定架构：只取该架构的单个镜像（目标名已由 plan 加上架构前缀）
            os="${PLATFORM%%/*}"
            rest="${PLATFORM#*/}"
            arch="${rest%%/*}"
            variant=""
            if [ "$rest" != "$arch" ]; then
                variant="${rest#*/}"
            fi
            copy_args+=(--override-os "$os" --override-arch "$arch")
            if [ -n "$variant" ]; then
                copy_args+=(--override-variant "$variant")
            fi

            echo "skopeo copy ${copy_args[*]} $src $dst"
            if ! skopeo copy "${copy_args[@]}" "$src" "$dst"; then
                echo "::error::搬运失败: $IMAGE -> $dst_ref"
                exit 1
            fi
            mode="单架构 $PLATFORM"
        else
            # 不指定架构：整份 manifest list 一起搬。
            # 但 buildx 构建的镜像会带 attestation 清单（config 为 application/vnd.oci.empty.v1+json），
            # 阿里云 ACR 会以「unknown manifest class」为由拒绝，所以先探测再决定策略。
            index_file="$(mktemp "$RUNNER_TEMP/index.XXXXXX")"
            att=0
            platforms=()
            src_set=""
            if skopeo inspect --retry-times 3 --raw "$src" > "$index_file" 2>/dev/null; then
                info="$(python3 "$GITHUB_WORKSPACE/.github/scripts/index_platforms.py" "$index_file")"
                att="$(printf '%s\n' "$info" | awk -F'|' '$1=="ATT"{print $2; exit}')"
                while IFS='|' read -r tag os arch variant dg; do
                    [ "$tag" = "PF" ] || continue
                    platforms+=("$os|$arch|$variant|$dg")
                done <<< "$info"
                src_set="$(pdigests "$index_file")"
            fi

            if [ "${att:-0}" -gt 0 ] && [ "${#platforms[@]}" -gt 0 ]; then
                # 重建 index 时剔除了 attestation，digest 必然和源不同，
                # 所以跳过判断改比「各架构子 manifest 的 digest 集合」
                dst_index="$(mktemp "$RUNNER_TEMP/index.XXXXXX")"
                dst_set=""
                if skopeo inspect --retry-times 3 --raw --authfile "$authfile" "$dst" > "$dst_index" 2>/dev/null; then
                    dst_set="$(pdigests "$dst_index")"
                fi
                rm -f "$dst_index"

                if [ -n "$src_set" ] && [ "$src_set" = "$dst_set" ]; then
                    echo "各架构 digest 与目标一致（只差 attestation），跳过: $dst"
                    rm -f "$index_file"
                    summary "⏭️ $IMAGE" "" "各架构 digest 一致（attestation 已剔除），跳过"
                    exit 0
                fi

                echo "源镜像带 $att 个 attestation 清单，ACR 不接受，改为按架构复制后重建 index"
                # buildx 走 docker 配置的凭据，这里补一次登录
                if ! printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY" >/dev/null; then
                    echo "::error::docker login 失败（重建 index 需要）"
                    exit 1
                fi

                # 引用子 manifest 时必须去掉 tag：skopeo 不接受「tag+digest」这种写法
                # （只去掉最后一段里的 :tag，避免把 registry:5000 的端口当 tag 切掉）
                repo="${IMAGE%%@*}"
                if [[ "${repo##*/}" == *:* ]]; then
                    repo="${repo%:*}"
                fi
                refs=()
                for p in "${platforms[@]}"; do
                    IFS='|' read -r os arch variant dg <<< "$p"
                    if [ -z "${dg:-}" ]; then continue; fi
                    echo "复制 ${os}/${arch} ${dg}"
                    if ! skopeo copy --authfile "$authfile" --retry-times 3 "docker://$repo@$dg" "$dst"; then
                        echo "::error::复制 ${os}/${arch} 失败: $dg"
                        exit 1
                    fi
                    refs+=("$dst_ref@$dg")
                done

                echo "docker buildx imagetools create -t $dst_ref ${refs[*]}"
                if ! docker buildx imagetools create -t "$dst_ref" "${refs[@]}"; then
                    echo "::error::重建 manifest list 失败: $dst_ref"
                    exit 1
                fi
                mode="多架构（剔除 ${att} 个 attestation 后重建，${#refs[@]} 个架构）"
            else
                copy_args+=(--all)
                echo "skopeo copy ${copy_args[*]} $src $dst"
                if ! skopeo copy "${copy_args[@]}" "$src" "$dst"; then
                    echo "::error::搬运失败: $IMAGE -> $dst_ref"
                    exit 1
                fi
                mode="多架构（--all）"
            fi
            rm -f "$index_file"
        fi

        summary "✅ $IMAGE" "$mode"
        rm -f "$authfile"
