name: Docker Image Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # 只有改了镜像清单、workflow 或解析脚本才触发，改读文档不会触发搬运
    paths:
      - 'images.txt'
      - '.github/workflows/docker.yaml'
      - '.github/scripts/plan.sh'

# 同一个仓库同时只跑一个搬运任务，避免并发抢配额、互相覆盖 tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 本任务只需要读代码，不给多余权限
permissions:
  contents: read

jobs:

  # ===== 第一步：解析 images.txt，生成并行矩阵 =====
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: 解析 images.txt
      id: plan
      run: bash .github/scripts/plan.sh

  # ===== 第二步：每个镜像一个 job 并行搬运 =====
  sync:
    name: ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 一个镜像失败不影响其它镜像
      fail-fast: false
      # 同时最多搬几个；阿里云侧限速或 runner 配额紧张就调小
      max-parallel: 5
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
    # 现在的 ubuntu-latest 自带 /dev/root 145G、可用约 88G，
    # 原来那套 maximize-build-space 会把根分区压到 2G，反而把 runner 自己写日志的空间挤爆
    - name: Free disk space
      run: |
        echo "清理前："
        df -h /
        # 空间本来就够时这几条几乎无成本；真遇到小规格 runner 也能腾出十几 G
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        docker image prune -af || true
        echo "清理后："
        df -h /
        avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
        echo "根分区可用: ${avail}G"
        if [ "$avail" -lt 5 ]; then
          echo "::error::根分区可用空间不足 5G，大镜像可能失败"
          exit 1
        fi

    - name: Pull & Push
      env:
        ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
        ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        IMAGE: ${{ matrix.image }}
        PLATFORM: ${{ matrix.platform }}
        # 目标仓库路径（命名空间/镜像名:tag），不含仓库地址
        TARGET: ${{ matrix.target }}
      run: |
        set -uo pipefail

        # 先确认 Secrets 都配了，比 docker login 报错更好定位
        for v in ALIYUN_REGISTRY ALIYUN_REGISTRY_USER ALIYUN_REGISTRY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
                echo "::error::缺少 Secret: $v"
                exit 1
            fi
        done

        new_image="$ALIYUN_REGISTRY/$TARGET"

        # 密码走 stdin，不出现在进程列表里
        if ! printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"; then
            echo "::error::登录阿里云仓库失败，请检查 ALIYUN_REGISTRY / ALIYUN_REGISTRY_USER / ALIYUN_REGISTRY_PASSWORD"
            exit 1
        fi

        pull_args=()
        if [ -n "${PLATFORM:-}" ]; then
            pull_args=(--platform "$PLATFORM")
            echo "docker pull --platform $PLATFORM $IMAGE"
        else
            echo "docker pull $IMAGE"
        fi

        if ! docker pull "${pull_args[@]}" "$IMAGE"; then
            echo "::error::拉取失败: $IMAGE"
            exit 1
        fi

        echo "docker tag $IMAGE $new_image"
        if ! docker tag "$IMAGE" "$new_image"; then
            echo "::error::打标签失败: $new_image"
            exit 1
        fi

        echo "docker push $new_image"
        if ! docker push "$new_image"; then
            echo "::error::推送失败: $new_image"
            exit 1
        fi

        # 及时释放空间，让 40GB 级别的大镜像也能搬
        docker rmi "$IMAGE" || true
        docker rmi "$new_image" || true

        {
            echo "### $IMAGE"
            echo ""
            echo "- 目标: \`$new_image\`"
            if [ -n "${PLATFORM:-}" ]; then
                echo "- 架构: \`$PLATFORM\`"
            fi
        } >> "$GITHUB_STEP_SUMMARY"
