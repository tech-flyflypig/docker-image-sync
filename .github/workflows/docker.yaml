name: Docker Image Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # 只有改了镜像清单、workflow 或解析脚本才触发，改读文档不会触发搬运
    paths:
      - 'images.txt'
      - '.github/workflows/docker.yaml'
      - '.github/scripts/plan.sh'

# 同一个仓库同时只跑一个搬运任务，避免并发抢配额、互相覆盖 tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 本任务只需要读代码，不给多余权限
permissions:
  contents: read

jobs:

  # ===== 第一步：解析 images.txt，生成并行矩阵 =====
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: 解析 images.txt
      id: plan
      run: bash .github/scripts/plan.sh

  # ===== 第二步：每个镜像一个 job 并行搬运 =====
  sync:
    name: ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 一个镜像失败不影响其它镜像
      fail-fast: false
      # 同时最多搬几个；阿里云侧限速或 runner 配额紧张就调小
      max-parallel: 5
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
    # 用 skopeo 直接在两个 registry 之间搬 blob：
    # - 不落本地镜像，40GB 的镜像也不用先扩容磁盘
    # - --all 保留多架构 manifest list，不再是「单架构另存一份」
    - name: Sync image (skopeo)
      env:
        ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
        ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        IMAGE: ${{ matrix.image }}
        PLATFORM: ${{ matrix.platform }}
        # 目标仓库路径（命名空间/镜像名:tag），不含仓库地址
        TARGET: ${{ matrix.target }}
      run: |
        set -uo pipefail

        # 先确认 Secrets 都配了，比 skopeo 报错更好定位
        for v in ALIYUN_REGISTRY ALIYUN_REGISTRY_USER ALIYUN_REGISTRY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
                echo "::error::缺少 Secret: $v"
                exit 1
            fi
        done

        if ! command -v skopeo >/dev/null 2>&1; then
            echo "runner 上没有 skopeo，安装一下"
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
        fi

        # 凭据放临时 authfile，避免密码出现在命令行/进程列表
        authfile="$RUNNER_TEMP/acr-auth.json"
        umask 077
        printf '{"auths":{"%s":{"auth":"%s"}}}' \
            "$ALIYUN_REGISTRY" \
            "$(printf '%s:%s' "$ALIYUN_REGISTRY_USER" "$ALIYUN_REGISTRY_PASSWORD" | base64 -w0)" \
            > "$authfile"

        src="docker://$IMAGE"
        dst="docker://$ALIYUN_REGISTRY/$TARGET"

        # 取「顶层 manifest / manifest list」的 digest：
        # 注意不能用 skopeo inspect --format '{{.Digest}}'，那个会解析到当前平台的子 manifest，
        # 多架构镜像下比到的不是 index；这里直接对 --raw 输出算 sha256。
        raw_digest() {
            local url="$1"; shift
            local f
            f="$(mktemp "$RUNNER_TEMP/manifest.XXXXXX")"
            if skopeo inspect --retry-times 3 --raw "$@" "$url" > "$f" 2>/dev/null; then
                sha256sum "$f" | cut -d' ' -f1
                rm -f "$f"
                return 0
            fi
            rm -f "$f"
            return 1
        }

        # ---- 已存在且 digest 一致就跳过，省掉整次全量拉取 ----
        src_digest="$(raw_digest "$src" || true)"
        dst_digest="$(raw_digest "$dst" --authfile "$authfile" || true)"

        echo "源 digest: ${src_digest:-<获取失败>}"
        echo "目标 digest: ${dst_digest:-<不存在或获取失败>}"

        if [ -n "$src_digest" ] && [ -n "$dst_digest" ] && [ "$src_digest" = "$dst_digest" ]; then
            echo "目标已是最新，跳过: $dst"
            {
                echo "### ⏭️ $IMAGE"
                echo ""
                echo "- 已存在且 digest 一致，跳过"
                echo "- 目标: \`$ALIYUN_REGISTRY/$TARGET\`"
                echo "- digest: \`$src_digest\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
        fi

        # ---- 复制 ----
        copy_args=(--authfile "$authfile" --retry-times 3)

        if [ -n "${PLATFORM:-}" ]; then
            # 指定架构：只取该架构的单个镜像（目标名已由 plan 加上架构前缀）
            os="${PLATFORM%%/*}"
            rest="${PLATFORM#*/}"
            arch="${rest%%/*}"
            variant=""
            if [ "$rest" != "$arch" ]; then
                variant="${rest#*/}"
            fi
            copy_args+=(--override-os "$os" --override-arch "$arch")
            if [ -n "$variant" ]; then
                copy_args+=(--override-variant "$variant")
            fi
            mode="单架构 $PLATFORM"
        else
            # 不指定架构：整份 manifest list 一起搬，arm64/amd64 都能拉
            copy_args+=(--all)
            mode="多架构（--all）"
        fi

        echo "skopeo copy ${copy_args[*]} $src $dst"
        if ! skopeo copy "${copy_args[@]}" "$src" "$dst"; then
            echo "::error::搬运失败: $IMAGE -> $ALIYUN_REGISTRY/$TARGET"
            exit 1
        fi

        {
            echo "### ✅ $IMAGE"
            echo ""
            echo "- 目标: \`$ALIYUN_REGISTRY/$TARGET\`"
            echo "- 模式: $mode"
            if [ -n "$src_digest" ]; then
                echo "- digest: \`$src_digest\`"
            fi
        } >> "$GITHUB_STEP_SUMMARY"

        rm -f "$authfile"
