name: Docker Image Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # 只有改了镜像清单、workflow 或解析脚本才触发，改读文档不会触发搬运
    paths:
      - 'images.txt'
      - '.github/workflows/docker.yaml'
      - '.github/scripts/plan.sh'
      - '.github/scripts/index_platforms.py'

# 同一个仓库同时只跑一个搬运任务，避免并发抢配额、互相覆盖 tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 本任务只需要读代码，不给多余权限
permissions:
  contents: read

jobs:

  # ===== 第一步：解析 images.txt，生成并行矩阵 =====
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: 解析 images.txt
      id: plan
      run: bash .github/scripts/plan.sh

  # ===== 第二步：每个镜像一个 job 并行搬运 =====
  sync:
    name: ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 一个镜像失败不影响其它镜像
      fail-fast: false
      # 同时最多搬几个；阿里云侧限速或 runner 配额紧张就调小
      max-parallel: 5
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 用 skopeo 直接在两个 registry 之间搬 blob：
    # - 不落本地镜像，40GB 的镜像也不用先扩容磁盘
    # - 默认只搬目标平台（linux/amd64），--platform=all 或逗号列表才搬多架构
    - name: Sync image (skopeo)
      env:
        ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
        ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        IMAGE: ${{ matrix.image }}
        PLATFORM: ${{ matrix.platform }}
        # 目标仓库路径（命名空间/镜像名:tag），不含仓库地址
        TARGET: ${{ matrix.target }}
      run: |
        set -uo pipefail

        # 先确认 Secrets 都配了，比 skopeo 报错更好定位
        for v in ALIYUN_REGISTRY ALIYUN_REGISTRY_USER ALIYUN_REGISTRY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
                echo "::error::缺少 Secret: $v"
                exit 1
            fi
        done

        if ! command -v skopeo >/dev/null 2>&1; then
            echo "runner 上没有 skopeo，安装一下"
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
        fi

        # 凭据放临时 authfile，避免密码出现在命令行/进程列表
        authfile="$RUNNER_TEMP/acr-auth.json"
        umask 077
        printf '{"auths":{"%s":{"auth":"%s"}}}' \
            "$ALIYUN_REGISTRY" \
            "$(printf '%s:%s' "$ALIYUN_REGISTRY_USER" "$ALIYUN_REGISTRY_PASSWORD" | base64 -w0)" \
            > "$authfile"

        src="docker://$IMAGE"
        dst_ref="$ALIYUN_REGISTRY/$TARGET"
        dst="docker://$dst_ref"

        # 平台模式：single（单个架构，默认 amd64）/ all（完整 index）/ subset（指定架构子集）
        PLATFORM="${PLATFORM:-linux/amd64}"
        case "$PLATFORM" in
            all)  MODE=all ;;
            *,*)  MODE=subset ;;
            *)    MODE=single ;;
        esac
        echo "平台: $PLATFORM（模式 $MODE）"

        # 写 job summary：$1=标题 $2=模式 $3=附加说明
        summary() {
            {
                echo "### $1"
                echo ""
                echo "- 目标: \`$dst_ref\`"
                if [ -n "${2:-}" ]; then echo "- 模式: $2"; fi
                if [ -n "${3:-}" ]; then echo "- $3"; fi
                if [ -n "$src_digest" ]; then echo "- 源 digest: \`$src_digest\`"; fi
            } >> "$GITHUB_STEP_SUMMARY"
        }

        # 列出 index 里各架构的子 manifest digest（排序后连成一串，便于比较）
        pdigests() {
            python3 "$GITHUB_WORKSPACE/.github/scripts/index_platforms.py" "$1" \
                | awk -F'|' '$1=="PF"{print $5}' | sort | tr '\n' ' '
        }

        # ---- 顶层 digest 一致就跳过，省掉整次拉取 ----
        # 注意不能用 skopeo inspect --format '{{.Digest}}'，那个会解析到当前平台的子 manifest；
        # 这里直接对 --raw 输出算 sha256，拿到的才是顶层 manifest/index 的 digest。
        raw_digest() {
            local url="$1"; shift
            local f
            f="$(mktemp "$RUNNER_TEMP/manifest.XXXXXX")"
            if skopeo inspect --retry-times 3 --raw "$@" "$url" > "$f" 2>/dev/null; then
                sha256sum "$f" | cut -d' ' -f1
                rm -f "$f"
                return 0
            fi
            rm -f "$f"
            return 1
        }

        src_digest="$(raw_digest "$src" || true)"
        dst_digest="$(raw_digest "$dst" --authfile "$authfile" || true)"

        echo "源 digest: ${src_digest:-<获取失败>}"
        echo "目标 digest: ${dst_digest:-<不存在或获取失败>}"

        if [ -n "$src_digest" ] && [ "$src_digest" = "$dst_digest" ]; then
            echo "目标已是最新，跳过: $dst"
            summary "⏭️ $IMAGE" "" "已存在且 digest 一致，跳过"
            rm -f "$authfile"
            exit 0
        fi

        # ===== 单架构：skopeo 直接按平台取子 manifest =====
        if [ "$MODE" = "single" ]; then
            os="${PLATFORM%%/*}"
            rest="${PLATFORM#*/}"
            arch="${rest%%/*}"
            variant=""
            if [ "$rest" != "$arch" ]; then
                variant="${rest#*/}"
            fi
            copy_args=(--authfile "$authfile" --retry-times 3 --override-os "$os" --override-arch "$arch")
            if [ -n "$variant" ]; then
                copy_args+=(--override-variant "$variant")
            fi
            echo "skopeo copy ${copy_args[*]} $src $dst"
            if ! skopeo copy "${copy_args[@]}" "$src" "$dst"; then
                echo "::error::搬运失败: $IMAGE -> $dst_ref"
                exit 1
            fi
            summary "✅ $IMAGE" "单架构 $PLATFORM"
            rm -f "$authfile"
            exit 0
        fi

        # ===== index 模式：先解析源的 manifest list =====
        index_file="$(mktemp "$RUNNER_TEMP/index.XXXXXX")"
        att=0
        platforms=()
        if skopeo inspect --retry-times 3 --raw "$src" > "$index_file" 2>/dev/null; then
            info="$(python3 "$GITHUB_WORKSPACE/.github/scripts/index_platforms.py" "$index_file")"
            att="$(printf '%s\n' "$info" | awk -F'|' '$1=="ATT"{print $2; exit}')"
            while IFS='|' read -r tag os arch variant dg; do
                [ "$tag" = "PF" ] || continue
                platforms+=("$os|$arch|$variant|$dg")
            done <<< "$info"
        fi
        rm -f "$index_file"

        # 源本身不是 manifest list（单架构镜像），直接整份复制
        if [ "${#platforms[@]}" -eq 0 ]; then
            echo "源不是 manifest list（单架构镜像），直接复制"
            if ! skopeo copy --authfile "$authfile" --retry-times 3 --all "$src" "$dst"; then
                echo "::error::搬运失败: $IMAGE -> $dst_ref"
                exit 1
            fi
            summary "✅ $IMAGE" "单 manifest"
            rm -f "$authfile"
            exit 0
        fi

        # 选出要保留的架构
        want=()
        if [ "$MODE" = "all" ]; then
            want=("${platforms[@]}")
        else
            IFS=',' read -r -a requested <<< "$PLATFORM"
            for p in "${platforms[@]}"; do
                IFS='|' read -r os arch variant dg <<< "$p"
                key="$os/$arch"
                if [ -n "$variant" ]; then
                    key="$key/$variant"
                fi
                for r in "${requested[@]}"; do
                    if [ "$r" = "$key" ] || [ "$r" = "$os/$arch" ]; then
                        want+=("$p")
                        break
                    fi
                done
            done
        fi

        if [ "${#want[@]}" -eq 0 ]; then
            echo "::error::$IMAGE 没有匹配到要保留的架构，可用：$(printf '%s\n' "${platforms[@]}" | tr '|' '/')"
            exit 1
        fi

        src_set="$(printf '%s\n' "${want[@]}" | awk -F'|' '{print $4}' | sort | tr '\n' ' ')"

        # 目标已有 index 且各架构 digest 一致 → 跳过
        # （重建过的 index 顶层 digest 必然和源不同，只能比子 manifest）
        dst_index="$(mktemp "$RUNNER_TEMP/index.XXXXXX")"
        dst_set=""
        if skopeo inspect --retry-times 3 --raw --authfile "$authfile" "$dst" > "$dst_index" 2>/dev/null; then
            dst_set="$(pdigests "$dst_index")"
        fi
        rm -f "$dst_index"

        if [ -n "$src_set" ] && [ "$src_set" = "$dst_set" ]; then
            echo "目标各架构 digest 一致，跳过: $dst"
            summary "⏭️ $IMAGE" "" "各架构 digest 一致，跳过"
            rm -f "$authfile"
            exit 0
        fi

        # 要全部架构且源没有 attestation → 一条 --all 搞定
        if [ "$MODE" = "all" ] && [ "${att:-0}" -eq 0 ]; then
            copy_args=(--authfile "$authfile" --retry-times 3 --all)
            echo "skopeo copy ${copy_args[*]} $src $dst"
            if ! skopeo copy "${copy_args[@]}" "$src" "$dst"; then
                echo "::error::搬运失败: $IMAGE -> $dst_ref"
                exit 1
            fi
            summary "✅ $IMAGE" "多架构（--all）"
            rm -f "$authfile"
            exit 0
        fi

        # 其余情况：逐架构复制 + 重建 index
        # （剔除 ACR 不认的 attestation，或者只保留请求的架构子集）
        if ! printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY" >/dev/null; then
            echo "::error::docker login 失败（重建 index 需要）"
            exit 1
        fi

        # 引用子 manifest 时必须去掉 tag：skopeo 不接受「tag+digest」这种写法
        # （只去掉最后一段里的 :tag，避免把 registry:5000 的端口当 tag 切掉）
        repo="${IMAGE%%@*}"
        if [[ "${repo##*/}" == *:* ]]; then
            repo="${repo%:*}"
        fi

        refs=()
        for p in "${want[@]}"; do
            IFS='|' read -r os arch variant dg <<< "$p"
            if [ -z "${dg:-}" ]; then continue; fi
            echo "复制 ${os}/${arch} ${dg}"
            if ! skopeo copy --authfile "$authfile" --retry-times 3 "docker://$repo@$dg" "$dst"; then
                echo "::error::复制 ${os}/${arch} 失败: $dg"
                exit 1
            fi
            refs+=("$dst_ref@$dg")
        done

        echo "docker buildx imagetools create -t $dst_ref ${refs[*]}"
        if ! docker buildx imagetools create -t "$dst_ref" "${refs[@]}"; then
            echo "::error::重建 manifest list 失败: $dst_ref"
            exit 1
        fi

        extra=""
        if [ "${att:-0}" -gt 0 ]; then
            extra="，剔除 $att 个 attestation"
        fi
        summary "✅ $IMAGE" "重建 index（${#refs[@]} 个架构${extra}）"
        rm -f "$authfile"
